name: Sync userscript branch from private world repo

on:
  schedule:
    # 毎日 03:00 UTC = 12:00 JST
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write   # この public リポジトリに push するため

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout public repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git user
        run: |
          git config user.name "Takashi SASAKI"
          git config user.email "takashi316@gmail.com"

      - name: Fetch userscript branch from private world repo
        env:
          TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          set -e

          # private repo を remote として追加
          git remote add world https://x-access-token:${TOKEN}@github.com/TakashiSasaki/world.git

          # パターンA: public 側の userscript ブランチにミラーする場合
          git fetch world userscript:userscript
          git push origin userscript --force

          # パターンB（Pages 用）: public 側の gh-pages ブランチにミラーするなら代わりにこちら
          # git fetch world userscript:gh-pages
          # git push origin gh-pages --force
