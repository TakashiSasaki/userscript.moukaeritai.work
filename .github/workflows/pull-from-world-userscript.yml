name: Pull userscript from private world repo into public (correct PAT URL)

on:
  schedule:
    # 毎日 03:00 UTC = 12:00 JST
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write   # 公開リポジトリ（gh-pages）へ push するため

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      # 1. 公開リポジトリを public/ にチェックアウト
      - name: Checkout public repo
        uses: actions/checkout@v4
        with:
          path: public
          fetch-depth: 0

      # 2. private world リポジトリを remote として追加（正しい PAT URL 形式）
      - name: Add private world repo as remote (correct PAT URL)
        working-directory: public
        env:
          TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          set -e
          git remote add world https://TakashiSasaki:${TOKEN}@github.com/TakashiSasaki/world.git

      # 3. デバッグ: TOKEN の所有者を確認
      - name: Debug TOKEN owner
        env:
          TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          set -e
          curl -s -H "Authorization: Bearer $TOKEN" https://api.github.com/user

      # 4. デバッグ: API 経由で world リポジトリアクセス確認
      - name: Debug repo access via API
        env:
          TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          set -x
          curl -s -H "Authorization: Bearer $TOKEN" \
            https://api.github.com/repos/TakashiSasaki/world

      # 5. デバッグ: Git 経由で world リポジトリアクセス確認（正しい PAT URL）
      - name: Debug access to world repo via Git (correct PAT URL)
        working-directory: public
        env:
          TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          set -x
          git ls-remote https://TakashiSasaki:${TOKEN}@github.com/TakashiSasaki/world.git HEAD

      # 6. world/userscript を gh-pages に反映
      - name: Pull userscript and publish to gh-pages
        working-directory: public
        env:
          TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          set -e

          git config user.name "Takashi SASAKI"
          git config user.email "takashi316@gmail.com"

          # userscript ブランチを取得して gh-pages へ上書き
          git fetch world userscript:gh-pages
          git checkout gh-pages

          git add -A
          git commit -m "Pull from world@userscript" || echo "No changes to commit"

          git push origin gh-pages --force
