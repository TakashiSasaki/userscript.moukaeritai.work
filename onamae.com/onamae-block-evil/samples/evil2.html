<div class="modal" data-dismiss="modal" ng-reflect-open-flg="false">
<div class="modal-Dialog is-Narrow">
<div class="modal-Dialog-Header">
<h3 class="modal-Dialog-Header-Title is-Center">会員情報に変更や誤りはございませんか？</h3>
</div>
<div class="modal-Dialog-Body pt28 pr20 pl20 pb28">
<section class="section">
<p> 現在設定されているMasterDNSから、レンタルDNSへの切り替えを行います。 その際、下記変更点にご注意ください。<br/>
                    ・外部のネームサーバーを指定されているオリジンのNSレコードは削除されます。<br/> ・任意で指定されているSOAレコードの内容は当社指定の内容に変更されます。<br/>
                    ・TSIG情報は削除されます。<br/> ・ゾーン転送用に設定されたIPは削除されます。<br/></p>
</section>
</div>
<div class="modal-Dialog-Footer">
<ul class="list-Btn is-Right mb0">
<li><button class="btn" data-dismiss="modal" type="button">承認</button></li>
</ul>
</div>
</div>
</div>
