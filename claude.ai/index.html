        .header-desc {

            border: 1px solid var(--glass-border);
            border-radius: 50px;

        }

        .top-nav-link:hover {
            color: white;
            background: rgba(255, 255, 255, 0.1);
            transform: translateX(-5px);
        }

        .project-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 2rem;
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .project-item {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            position: relative;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            backdrop-filter: blur(15px);
            overflow: hidden;
        }

        .project-item:hover {
            transform: translateY(-10px);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .project-title {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin: 0 0 1.2rem 0;
        }

        .project-title img {
            width: 38px;
            height: 38px;
            border-radius: 8px;
        }

        .project-title a {
            text-decoration: none;
            color: var(--text-main);
            font-weight: 600;
            font-size: 1.25rem;
        }

        .project-desc {
            flex-grow: 1;
            color: var(--text-dim);
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .install-button {
            align-self: flex-start;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 24px;
            background: var(--primary);
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .install-button:hover {
            background: var(--primary-dark);
            transform: scale(1.05);
        }

        footer {
            text-align: center;
            margin-top: 6em;
            padding-bottom: 3em;
            color: var(--text-dim);

</head>
