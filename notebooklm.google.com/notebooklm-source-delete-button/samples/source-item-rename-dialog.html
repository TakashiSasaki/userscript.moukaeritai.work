<mat-dialog-container tabindex="-1" class="mat-mdc-dialog-container mdc-dialog cdk-dialog-container mdc-dialog--open mat-mdc-dialog-container-with-actions" id="mat-mdc-dialog-0" role="dialog" aria-modal="false">
<div class="mat-mdc-dialog-inner-container mdc-dialog__container">
<div class="mat-mdc-dialog-surface mdc-dialog__surface">
<edit-source-dialog class="mat-mdc-dialog-component-host">
<div class="edit-source-dialog">
<form class="ng-pristine ng-valid ng-touched">
<mat-dialog-content class="mat-mdc-dialog-content mdc-dialog__content">
<div class="title-container">
<mat-label class="title-label mat-title-medium">
Rename All notes 2026/1/16?
</mat-label>
</div>
<mat-form-field appearance="outline" color="primary" class="mat-mdc-form-field input-form-field mat-mdc-form-field-type-mat-input mat-form-field-appearance-outline mat-primary ng-valid ng-touched">
<div class="mat-mdc-text-field-wrapper mdc-text-field mdc-text-field--outlined">
<div class="mat-mdc-form-field-flex">
<div class="mdc-notched-outline mdc-notched-outline--notched mdc-notched-outline--upgraded">
<div class="mat-mdc-notch-piece mdc-notched-outline__leading">
</div>
<div class="mat-mdc-notch-piece mdc-notched-outline__notch" style="width: calc(110px * var(--mat-mdc-form-field-floating-label-scale, 0.75) + 9px);">
<label class="mdc-floating-label mat-mdc-floating-label mdc-floating-label--float-above" id="mat-mdc-form-field-label-1" for="mat-input-1">
<mat-label>
Source Name
</mat-label>
<span aria-hidden="true" class="mat-mdc-form-field-required-marker mdc-floating-label--required">
</span>
</label>
</div>
<div class="mat-mdc-notch-piece mdc-notched-outline__trailing">
</div>
</div>
<div class="mat-mdc-form-field-infix">
<input formcontrolname="title" class="mat-mdc-input-element title-input ng-pristine ng-valid mat-mdc-form-field-input-control mdc-text-field__input cdk-text-field-autofill-monitored ng-touched" placeholder="All notes 2026/1/16" id="mat-input-1" aria-invalid="false" aria-required="true"/>
</div>
</div>
</div>
<div aria-atomic="true" aria-live="polite" class="mat-mdc-form-field-subscript-wrapper mat-mdc-form-field-bottom-align">
<div class="mat-mdc-form-field-hint-wrapper">
<div class="mat-mdc-form-field-hint-spacer">
</div>
</div>
</div>
</mat-form-field>
</mat-dialog-content>
<mat-dialog-actions align="end" class="mat-mdc-dialog-actions mdc-dialog__actions mat-mdc-dialog-actions-align-end">
<button color="primary" type="button" class="mdc-button mat-mdc-button-base cancel-button mat-mdc-button mat-primary">
<span class="mat-mdc-button-persistent-ripple mdc-button__ripple">
</span>
<span class="mdc-button__label">
Cancel
</span>
<span class="mat-focus-indicator">
</span>
<span class="mat-mdc-button-touch-target">
</span>
</button>
</mat-dialog-actions>
</form>
</div>
</edit-source-dialog>
</div>
</div>
</mat-dialog-container>
