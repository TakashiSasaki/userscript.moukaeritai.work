<template id="tpl-one-turn-panel">
    <div class="one-turn-inactive-content" title="Gemini 1-Click Export to Docs">
        <div class="one-turn-inactive-version gus-version">📄 v{{scriptVersion}}</div>
    </div>

    <div class="one-turn-active-content one-turn-controls-col">
        <!-- 2x2 Grid: Checkboxes + Exec Button -->
        <div class="one-turn-controls-grid">
            <label class="cb-item-1">
                <input type="checkbox" id="gemini-auto-delete-cb" checked>
                Auto-Delete (3s)
            </label>
            <label class="cb-item-2">
                <input type="checkbox" id="gemini-auto-url-cb">
                Auto-Export
            </label>
            <label class="cb-item-3">
                <input type="checkbox" id="gemini-auto-copy-images-cb" checked>
                Auto-Copy Images
            </label>

            <button id="gemini-btn-one-turn-exec" class="btn-item-4">
                <span style="display: flex;">
                    <svg height="16" viewBox="0 -960 960 960" width="16" fill="currentColor">
                        <path d="M320-240h320v-80H320v80Zm0-160h320v-80H320v80ZM240-80q-33 0-56.5-23.5T160-160v-640q0-33 23.5-56.5T240-880h320l240 240v480q0 33-23.5 56.5T720-80H240Zm280-520v-200H240v640h480v-440H520ZM240-800v200-200 640-640Z"></path>
                    </svg>
                </span>
                Export & Delete
            </button>
        </div>

        <!-- ROW 3: Dependencies + Version -->
        <div class="one-turn-row dependencies-row">
            <span id="ge2d-dep-auto-select" class="ge2d-dependency-icon" title="Auto-Select Next - Checking...">⏭️ Auto-Select <span class="dep-version">(...)</span></span>
            <span id="ge2d-dep-1click-del" class="ge2d-dependency-icon" title="1-Click Delete - Checking...">🗑️ Delete <span class="dep-version">(...)</span></span>
            <span id="ge2d-dep-turn-counter" class="ge2d-dependency-icon" title="Turn Counter - Checking...">📋 Images <span class="dep-version">(...)</span></span>
            <span class="one-turn-version" title="Gemini 1-Click Export to Docs">v{{scriptVersion}}</span>
        </div>
    </div>
</template>

<template id="tpl-export-button">
    <button class="gemini-quick-export-btn" title="1-Click Export to Docs">
        <span class="export-btn-icon">
            <svg height="20" viewBox="0 -960 960 960" width="20" fill="currentColor">
                <path d="M320-240h320v-80H320v80Zm0-160h320v-80H320v80ZM240-80q-33 0-56.5-23.5T160-160v-640q0-33 23.5-56.5T240-880h320l240 240v480q0 33-23.5 56.5T720-80H240Zm280-520v-200H240v640h480v-440H520ZM240-800v200-200 640-640Z"></path>
            </svg>
        </span>
    </button>
</template>

<template id="tpl-export-overlay">
    <div id="gemini-export-overlay">
        <div class="gemini-spinner"></div>
        <div>Exporting to Docs...</div>
    </div>
</template>

<template id="tpl-docs-icon">
    <svg height="20" viewBox="0 -960 960 960" width="20" fill="currentColor">
        <path d="M320-240h320v-80H320v80Zm0-160h320v-80H320v80ZM240-80q-33 0-56.5-23.5T160-160v-640q0-33 23.5-56.5T240-880h320l240 240v480q0 33-23.5 56.5T720-80H240Zm280-520v-200H240v640h480v-440H520ZM240-800v200-200 640-640Z"></path>
    </svg>
</template>

<template id="tpl-check-icon">
    <svg height="20" viewBox="0 -960 960 960" width="20" fill="currentColor">
        <path d="M382-240 154-468l57-57 171 171 367-367 57 57-424 424Z"></path>
    </svg>
</template>
