<template id="tpl-export-button">
    <button class="gemini-quick-export-btn" title="Export this response to Google Docs">
        <span class="export-btn-icon">
            <svg viewBox="0 0 24 24" width="18" height="18">
                <path fill="currentColor" d="M14,2H6A2,2 0 0,0 4,4V20A2,2 0 0,0 6,22H18A2,2 0 0,0 20,20V8L14,2M13,9V3.5L18.5,9H13Z" />
            </svg>
        </span>
    </button>
</template>

<template id="tpl-docs-icon">
    <svg viewBox="0 0 24 24" width="20" height="20">
        <path fill="currentColor" d="M14,2H6A2,2 0 0,0 4,4V20A2,2 0 0,0 6,22H18A2,2 0 0,0 20,20V8L14,2M13,9V3.5L18.5,9H13Z" />
    </svg>
</template>

<template id="tpl-check-icon">
    <svg viewBox="0 0 24 24" width="20" height="20">
        <path fill="currentColor" d="M21,7L9,19L3.5,13.5L4.91,12.09L9,16.17L19.59,5.59L21,7Z" />
    </svg>
</template>

<template id="tpl-export-overlay">
    <div id="gemini-export-overlay" class="gemini-export-overlay">
        <div class="export-spinner"></div>
        <div class="export-status-text">Exporting to Google Docs...</div>
    </div>
</template>

<template id="tpl-one-turn-panel">
    <div class="one-turn-content">
        <div class="one-turn-body">
            <div id="ge2d-script-status-container" class="gus-script-status-container"></div>
            <div class="one-turn-actions">
                <button id="gemini-btn-one-turn-exec" class="one-turn-exec-btn">
                    Export to Docs
                </button>
                <div class="one-turn-options">
                    <label class="one-turn-checkbox-label" title="Export and then delete the conversation">
                        <input type="checkbox" id="gemini-auto-delete-cb">
                        Auto-delete after export
                    </label>
                    <label class="one-turn-checkbox-label" title="Export immediately if matched URL found">
                        <input type="checkbox" id="gemini-auto-url-cb">
                        Auto-export matched URL
                    </label>
                    <label class="one-turn-checkbox-label" title="Copy article images to clipboard">
                        <input type="checkbox" id="gemini-auto-copy-images-cb">
                        Auto-copy images
                    </label>
                </div>
            </div>
        </div>
        <div class="one-turn-footer">
            <div class="dep-indicators">
                <div id="ge2d-dep-turn-counter" class="dep-item" title="Gemini Turn Counter">
                    <span class="dep-icon">🔢</span>
                    <span class="dep-version">...</span>
                </div>
                <div id="ge2d-dep-1click-del" class="dep-item" title="Gemini 1-Click Delete Conversation">
                    <span class="dep-icon">🗑️</span>
                    <span class="dep-version">...</span>
                </div>
                <div id="ge2d-dep-auto-select" class="dep-item" title="Gemini Auto-Select Next">
                    <span class="dep-icon">⏭️</span>
                    <span class="dep-version">...</span>
                </div>
            </div>
        </div>
    </div>
</template>
