<!-- Fragments for Gemini Saved Info Helper -->

<!-- Version Badge Fragment -->
<template id="gsi-template-badge">
    <span class="gus-version">📋 </span>
</template>

<!-- Copy All Button Fragment -->
<template id="gsi-template-copy-all">
    <button id="userscript-gemini-saved-info-copy-all-button" class="mdc-button mat-mdc-button-base mat-mdc-outlined-button">
        <mat-icon class="mat-icon notranslate google-symbols mat-ligature-font mat-icon-no-color" aria-hidden="true">library_books</mat-icon>
        <span class="mdc-button__label">Copy all</span>
    </button>
</template>

<!-- Item Copy Button Fragment -->
<template id="gsi-template-copy-item">
    <button class="userscript-gemini-saved-info-copy-button mdc-icon-button mat-mdc-icon-button mat-mdc-button-base" aria-label="Copy instruction">
        <mat-icon class="mat-icon notranslate google-symbols mat-ligature-font mat-icon-no-color" aria-hidden="true" fonticon="content_copy">content_copy</mat-icon>
    </button>
</template>

<!-- Toast Fragment -->
<template id="gsi-template-toast">
    <div class="userscript-gemini-saved-info-toast gus-panel"></div>
</template>
