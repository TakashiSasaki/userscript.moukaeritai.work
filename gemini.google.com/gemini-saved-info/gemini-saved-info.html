<!-- Gemini Saved Info Helper Templates -->

<template id="gsi-template-toast">
    <div class="userscript-gemini-saved-info-toast"></div>
</template>

<template id="gsi-template-copy-all">
    <button id="userscript-gemini-saved-info-copy-all-button" class="mdc-button mdc-button--outlined mat-mdc-outlined-button mat-unthemed mat-mdc-button-base" mat-ripple-loader-uninitialized="">
        <span class="mat-mdc-button-touch-target"></span>
        <span class="mdc-button__label">Copy all</span>
    </button>
</template>

<template id="gsi-template-copy-item">
    <button class="userscript-gemini-saved-info-copy-button mat-mdc-icon-button mat-unthemed mat-mdc-button-base" mat-ripple-loader-uninitialized="" title="Copy this instruction">
        <span class="mat-mdc-button-touch-target"></span>
        <mat-icon role="img" class="mat-icon notranslate material-icons mat-ligature-font mat-icon-no-color" aria-hidden="true" data-mat-icon-type="font">content_copy</mat-icon>
    </button>
</template>
