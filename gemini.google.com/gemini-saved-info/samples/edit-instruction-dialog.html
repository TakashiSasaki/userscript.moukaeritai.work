<html>
<body>
<div class="cdk-overlay-pane mat-mdc-dialog-panel" id="cdk-overlay-7" style="width: calc(-48px + 100vw); max-width: 600px; position: static;">
<div aria-hidden="true" class="cdk-visually-hidden cdk-focus-trap-anchor" tabindex="0">
</div>
<mat-dialog-container aria-labelledby="mat-mdc-dialog-title-1" aria-modal="false" class="mat-mdc-dialog-container mdc-dialog cdk-dialog-container mdc-dialog--open _mat-animation-noopable mat-mdc-dialog-container-with-actions" id="mat-mdc-dialog-1" role="dialog" tabindex="-1">
<div class="mat-mdc-dialog-inner-container mdc-dialog__container">
<div class="mat-mdc-dialog-surface mdc-dialog__surface">
<edit-memory-dialog class="mat-mdc-dialog-component-host ng-star-inserted">
<h1 class="mat-mdc-dialog-title mdc-dialog__title gds-title-l" id="mat-mdc-dialog-title-1">
What do you want Gemini to remember?
</h1>
<mat-dialog-content class="mat-mdc-dialog-content mdc-dialog__content">
<mat-form-field appearance="outline" class="mat-mdc-form-field edit-memory-form-field mat-mdc-form-field-type-mat-input mat-form-field-appearance-outline mat-primary ng-valid ng-touched" subscriptsizing="dynamic">
<div class="mat-mdc-text-field-wrapper mdc-text-field mdc-text-field--outlined mdc-text-field--no-label">
<div class="mat-mdc-form-field-flex">
<div class="mdc-notched-outline mdc-notched-outline--no-label ng-star-inserted">
<div class="mat-mdc-notch-piece mdc-notched-outline__leading">
</div>
<div class="mat-mdc-notch-piece mdc-notched-outline__notch">
</div>
<div class="mat-mdc-notch-piece mdc-notched-outline__trailing">
</div>
</div>
<div class="mat-mdc-form-field-infix">
<textarea aria-invalid="false" aria-label="Enter new memory" aria-required="false" class="mat-mdc-input-element cdk-textarea-autosize edit-memory-input mat-mdc-form-field-textarea-control mat-mdc-form-field-input-control mdc-text-field__input ng-pristine ng-valid cdk-text-field-autofill-monitored ng-touched" id="mat-input-1" maxlength="10000" placeholder="For example, “I prefer short, concise responses”" rows="1" style="height: 72px;">    </textarea>
</div>
</div>
</div>
<div aria-atomic="true" aria-live="polite" class="mat-mdc-form-field-subscript-wrapper mat-mdc-form-field-bottom-align mat-mdc-form-field-subscript-dynamic-size">
<div class="mat-mdc-form-field-hint-wrapper ng-star-inserted">
<div class="mat-mdc-form-field-hint-spacer">
</div>
</div>
</div>
</mat-form-field>
</mat-dialog-content>
<mat-dialog-actions align="end" class="mat-mdc-dialog-actions mdc-dialog__actions mat-mdc-dialog-actions-align-end">
<button class="mdc-button mat-mdc-button-base mat-mdc-button mat-primary _mat-animation-noopable" color="primary" mat-ripple-loader-class-name="mat-mdc-button-ripple" type="button">
<span class="mat-mdc-button-persistent-ripple mdc-button__ripple">
</span>
<span class="mdc-button__label">
Cancel
</span>
<span class="mat-focus-indicator">
</span>
<span class="mat-mdc-button-touch-target">
</span>
</button>
<button class="mdc-button mat-mdc-button-base edit-memory-submit-button mdc-button--unelevated mat-mdc-unelevated-button mat-primary mat-mdc-button-disabled _mat-animation-noopable" color="primary" data-test-id="submit-button" disabled="true" mat-ripple-loader-class-name="mat-mdc-button-ripple">
<span class="mat-mdc-button-persistent-ripple mdc-button__ripple">
</span>
<span class="mdc-button__label">
<span class="ng-star-inserted">
Submit
</span>
</span>
<span class="mat-focus-indicator">
</span>
<span class="mat-mdc-button-touch-target">
</span>
</button>
</mat-dialog-actions>
</edit-memory-dialog>
</div>
</div>
</mat-dialog-container>
<div aria-hidden="true" class="cdk-visually-hidden cdk-focus-trap-anchor" tabindex="0">
</div>
</div>
</body>
</html>
