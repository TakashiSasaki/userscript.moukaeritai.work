    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const markdown = `
# Gemini Profile Badge

Google Gemini のウェブページにおいて、ユーザープロフィール画像が表示される箇所に任意の文字列（数文字程度のテキストや絵文字）を「バッジ」として追加表示するユーザースクリプトです。

対象URL: \`https://gemini.google.com/app\`

<div id="script-info" style="margin: 20px 0; padding: 10px; background-color: #f6f8fa; border-left: 4px solid #2ea44f; font-size: 14px;">
    <strong>最新バージョン:</strong> <span id="ver-info">読み込み中...</span><br>
    <strong>最終更新日:</strong> <span id="date-info">読み込み中...</span>
</div>

<a href="gemini-profile-badge.user.js" class="install-button">スクリプトをインストール</a>

## 設定 (Configuration)

ユーザースクリプトのメニューコマンドを通じてバッジのテキストを簡単設定できます。

1.  ブラウザのツールバーにあるTampermonkeyのアイコンをクリックします。
2.  表示されるメニューから「**Set Badge Text**」を選択します。
3.  プロンプトが表示されたら、バッジとして表示したいテキストを入力し、「OK」をクリックします。
    -   テキストを空にすると、バッジは非表示になります。
    -   設定は即座に反映されます。

この設定はTampermonkeyが提供するローカルストレージに保存されます。

## 機能仕様

*   **パフォーマンス設計**: ページの初期表示に必須ではないため、読み込みパフォーマンスに影響を与えないよう \`MutationObserver\` を用いて非同期で描画処理を行います。
*   **重複描画の防止**: \`MutationObserver\` が複数回発火した場合でもバッジが重複して描画されないよう制御しています。
*   **動的な更新**: メニューからバッジテキストが更新された際、既存のバッジの内容を即座に更新します。
`;
            document.getElementById('content').innerHTML = marked.parse(markdown);

            // Fetch version from script metadata
            try {
                const response = await fetch('gemini-profile-badge.user.js');
                if (response.ok) {
                    const text = await response.text();
                    const versionMatch = text.match(/\/\/ @version\s+([\d.]+)/);
                    const dateMatch = text.match(/\/\/ @lastModified\s+([\d-]+)/);
                    if (versionMatch) {
                        const version = versionMatch[1];
                        const date = dateMatch ? dateMatch[1] : '不明';

                        // Update info labels
                        const verEl = document.getElementById('ver-info');
                        const dateEl = document.getElementById('date-info');
                        if (verEl) verEl.textContent = `v${version}`;
                        if (dateEl) dateEl.textContent = date;

                        const installBtn = document.querySelector('.install-button');
                        if (installBtn) {
                            installBtn.textContent = `スクリプトをインストール (v${version})`;
                        }
                    }
                }
            } catch (e) {
                console.warn('Could not fetch script version:', e);
            }
        });
    </script>
