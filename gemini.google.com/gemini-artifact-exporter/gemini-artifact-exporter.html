<div class="gae-exporter-container">
    <div id="gae-script-status-container" class="gus-script-status-container"></div>
    <div id="gae-main-content" style="display: flex; flex-direction: column; gap: 12px; margin-top: 8px;">
        <div class="gae-button-group">
            <button id="gemini-btn-scan" class="gae-button">Scan Artifacts</button>
            <button id="gemini-btn-deep-scan" class="gae-button secondary">Deep Scan</button>
        </div>

        <div id="gemini-artifact-list-container" class="gae-list-container" style="display: none;">
            <!-- Rendered by JS -->
        </div>

        <div style="display: flex; align-items: center; gap: 8px;">
            <button id="gemini-btn-export" class="gae-button primary" style="display: none; flex: 1;">Export Selected</button>
            <span id="gemini-batch-export-progress" style="font-size: 12px; color: var(--gus-panel-text); min-width: 40px; text-align: center;"></span>
        </div>

        <div class="gae-options">
            <label class="gae-checkbox-label">
                <input type="checkbox" id="gae-auto-delete-cb">
                Auto-delete conversation after export
            </label>
        </div>
    </div>
</div>
