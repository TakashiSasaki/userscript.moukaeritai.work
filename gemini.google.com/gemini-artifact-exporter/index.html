# Gemini Artifact Exporter

Google Gemini のサイドバーに表示されるすべての「記事 (Article)」タイプのアーティファクトを、Google ドキュメントへ一括でエクスポートするユーザースクリプトです。

<a href="gemini-artifact-exporter.user.js" class="install-button">スクリプトをインストール</a>

## 概要

Geminiの会話ページ（例: \`https://gemini.google.com/app/xxxxxxxx\`）を開くと、画面上にドラッグ可能な「Artifact Exporter」コントロールパネルが表示されます。
このパネルを使用して、会話内に生成された複数の記事を一括で保存できます。

## 主な機能

*   **アーティファクトのスキャン**: 会話内にあるすべての「記事」タイプアーティファクトを自動検出し、リスト表示します。
*   **一括エクスポート**: リストから選択した記事を、一つずつ順番に Google ドキュメントへエクスポートします。
*   **スタック回避ロジック**: GeminiのUIバグ（処理完了後に背景やトーストが残る現象）を自動で検知・解決し、連続したエクスポート処理を維持します。
*   **設定の保存**: コントロールパネルの位置やタイムアウト設定はブラウザに保存され、次回アクセス時も維持されます。

## 使い方

1.  **インストール**: Tampermonkey 等のマネージャにスクリプトをインストールします。
2.  **ページを開く**: アーティファクトを含むGeminiの会話ページを開きます。
3.  **スキャン**: パネルの **\`Scan Artifacts\`** ボタンをクリックして記事一覧を取得します。
4.  **選択**: エクスポートしたい記事にチェックを入れます（デフォルトで全選択）。
5.  **実行**: **\`Export Selected\`** ボタンをクリックしてエクスポートを開始します。
6.  **完了待機**: 順番に処理が実行されます。処理中はタブを閉じないでください。

## コントロールパネルの項目

*   **\`Scan Artifacts\`**: サイドバーからエクスポート可能な記事を再スキャンします。別の会話に移動した際などに使用してください。
*   **\`Export Selected\`**: 選択中のアイテムのエクスポートを開始します。実行中は \`Cancel Export\` ボタンに変わり、途中で停止できます。
*   **\`Timeout (s)\`**: 各アーティファクトの処理において、Google ドキュメント側の応答を待機する最大秒数です（デフォルト10秒）。通信環境や記事の長さに応じて調整してください。

## 注意事項

*   **Google ログイン**: 事前に Google ドキュメントが利用可能なアカウントでログインしている必要があります。
*   **UIの自動操作**: このスクリプトは Gemini の標準機能を自動でクリックして操作します。処理中に手動でメニューを操作すると干渉する場合があります。
*   **処理時間**: 記事の数が多い場合、完了まで数分かかることがあります。

## 更新履歴

*   **v0.2.34**: Gemini側のUIスタックバグに対するアグレッシブなクリーンアップ機能を実装。
*   **v0.2.20**: タイムアウト設定機能を追加。
`;
