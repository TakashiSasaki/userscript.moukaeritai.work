<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Auto-Scroll - Documentation</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- Github Markdown CSS for content -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.2.0/github-markdown.min.css">
    <style>
        :root {
            --primary: #4e95ff;
            --primary-dark: #3a7bd5;
            --bg-gradient: linear-gradient(135.2deg, rgba(7, 12, 23, 1) 1.2%, rgba(13, 33, 64, 1) 98.1%);
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-dim: #b0b8c4;
        }

        body {
            font-family: 'Outfit', sans-serif;
            margin: 0;
            padding: 0;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 4rem 2rem;
        }

        .doc-card {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 3rem;
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .markdown-body {
            background: transparent !important;
            color: var(--text-main) !important;
            font-family: inherit !important;
        }

        .markdown-body h1,
        .markdown-body h2,
        .markdown-body h3 {
            color: white !important;
            border-bottom: 1px solid var(--glass-border) !important;
        }

        .markdown-body code {
            background-color: rgba(255, 255, 255, 0.1) !important;
            color: var(--primary) !important;
            border-radius: 4px;
        }

        .markdown-body pre {
            background-color: rgba(0, 0, 0, 0.3) !important;
            border: 1px solid var(--glass-border);
            border-radius: 12px;
        }

        .markdown-body a {
            color: var(--primary) !important;
        }

        .top-nav {
            position: absolute;
            top: 2rem;
            left: 2rem;
            z-index: 10;
        }

        .top-nav-link {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--text-dim);
            font-weight: 400;
            padding: 8px 16px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 50px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .top-nav-link:hover {
            color: white;
            background: rgba(255, 255, 255, 0.1);
            transform: translateX(-5px);
        }

        footer {
            text-align: center;
            margin-top: 4rem;
            padding-bottom: 3rem;
            color: var(--text-dim);
            font-weight: 300;
        }

        footer a {
            color: var(--primary);
            text-decoration: none;
        }

        #content {
            min-height: 200px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 2rem 1rem;
            }

            .doc-card {
                padding: 1.5rem;
            }

            .top-nav {
                position: static;
                margin-bottom: 2rem;
                display: flex;
                justify-content: center;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <nav class="top-nav">
            <a class="top-nav-link" href="../index.html">
                <svg fill="currentColor" height="20" viewBox="0 -960 960 960" width="20">
                    <path
                        d="M240-200h120v-240h240v240h120v-360L480-740 240-560v360Zm-80 80v-480l320-240 320 240v480H520v-240h-80v240H160Zm320-350Z" />
                </svg>
                Back to Home
            </a>
        </nav>

        <section class="doc-card">
            <div id="content" class="markdown-body">Loading documentation...</div>
        </section>

        <footer>
            <p>
                <small>Developed by <a href="https://x.com/TakashiSasaki">Takashi Sasaki</a> | <a
                        href="https://userscript.moukaeritai.work/">moukaeritai.work</a></small>
            </p>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            fetch('README.md')
                .then(response => {
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    return response.text();
                })
                .then(text => {
                    document.getElementById('content').innerHTML = marked.parse(text);
                })
                .catch(err => {
                    document.getElementById('content').innerHTML = `<h3>Error loading document</h3><p>${err.message}</p>`;
                    console.error('Error fetching markdown:', err);
                });
        });
    </script>
</body>

</html>
