<div id="yt-filter-panel" class="yus-panel" style="background-color: #fff4e5; border-color: #ccc; --yus-hover-color: #00f;">
    <div id="yt-filter-header" class="yus-header">
        <span id="yt-filter-title" class="yus-title" title="Double-click to toggle minimization">Playlist Filter v{{VERSION}}</span>
    </div>
    <div id="yt-filter-panel-content" class="yus-content">
        <div style="display: flex; flex-direction: column; gap: 2px;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <span style="font-size: 12px; font-weight: bold;">Title Filter</span>
                <button id="yt-filter-title-clear" type="button" style="font-size: 14px; cursor: pointer; border: none; background: none; padding: 0 4px; color: #999;">×</button>
            </div>
            <input id="yt-filter-title-input" type="text" placeholder="Filter by title..." style="width: 100%; padding: 4px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
        </div>
        <div style="display: flex; flex-direction: column; gap: 2px;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <span style="font-size: 12px; font-weight: bold;">Channel Filter</span>
                <button id="yt-filter-channel-clear" type="button" style="font-size: 14px; cursor: pointer; border: none; background: none; padding: 0 4px; color: #999;">×</button>
            </div>
            <input id="yt-filter-channel-input" type="text" placeholder="Filter by channel..." style="width: 100%; padding: 4px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
        </div>
        <div id="yt-filter-count" style="font-size: 12px;">Results: - / -</div>
        <button id="yt-filter-apply-btn" type="button" style="width: 100%; padding: 6px; font-size: 12px; cursor: pointer; background-color: #065fd4; color: white; border: none; border-radius: 4px; margin-top: 4px;">Apply Filter</button>
        <div style="font-size: 11px; color: #666; display: flex; flex-direction: column;">
            <div id="yt-filter-status-filtering">Filtering: Idle</div>
        </div>
        <hr style="width: 100%; border: 0; border-top: 1px solid #ccc; margin: 4px 0;">
        <div id="yt-filter-range-info" style="font-size: 11px; margin-bottom: 2px;">Range: None</div>
    </div>
</div>
