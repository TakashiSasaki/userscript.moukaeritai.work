<div id="yt-filter-panel" class="yus-panel" style="--yus-panel-bg-rgb: 255, 244, 229; border-color: #ccc; --yus-hover-color: #00f;">
    <div id="yt-filter-header" class="yus-header">
        <span id="yt-filter-title" class="yus-title" title="Double-click to toggle minimization">Playlist Filter v{{VERSION}}</span>
    </div>
    <div id="yt-filter-panel-content" class="yus-content">
        <div style="display: flex; flex-direction: column; gap: 2px;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <span style="font-size: 12px; font-weight: bold;">Title Filter</span>
            </div>
            <input id="yt-filter-title-input" type="text" placeholder="Hover to pause, Enter to apply" style="width: 100%; padding: 4px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
        </div>
        <div style="display: flex; flex-direction: column; gap: 2px;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <span style="font-size: 12px; font-weight: bold;">Channel Filter</span>
            </div>
            <input id="yt-filter-channel-input" type="text" placeholder="Click to clear both filters" style="width: 100%; padding: 4px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
        </div>
        <div id="yt-filter-count" style="font-size: 12px;">Results: - / -</div>
        <div id="yt-filter-queue-info" style="font-size: 11px; color: #666;">Queue: 0 items</div>
        <div style="font-size: 10px; color: #666; margin-top: 2px;">Hover an input to pause. Click an input to clear both filters. Press Enter to resume filtering.</div>
        <div style="font-size: 10px; color: #666; display: flex; flex-direction: column; gap: 1px;">
            <div id="yt-filter-status-monitor">Monitor: Idle</div>
            <div id="yt-filter-status-scanner">Scanner: Idle</div>
            <div id="yt-filter-status-processor">Processor: Idle</div>
        </div>
        <hr style="width: 100%; border: 0; border-top: 1px solid #ccc; margin: 4px 0;">
        <div id="yt-filter-range-info" style="font-size: 11px; margin-bottom: 2px;">Range: None</div>
    </div>
</div>
