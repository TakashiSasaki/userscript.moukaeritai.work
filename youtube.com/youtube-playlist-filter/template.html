<div id="yt-filter-panel" class="yus-panel" style="--yus-panel-bg-rgb: 255, 244, 229; border-color: #ccc; --yus-hover-color: #00f;">
    <div id="yt-filter-header" class="yus-header">
        <span id="yt-filter-title" class="yus-title" title="Double-click to toggle minimization">Playlist Filter v{{VERSION}}</span>
    </div>
    <div id="yt-filter-panel-content" class="yus-content">
        <div style="display: flex; flex-direction: column; gap: 2px;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <span style="font-size: 12px; font-weight: bold;">Filter Query (AND within row, OR across rows)</span>
            </div>
            <div style="display: flex; gap: 10px; font-size: 11px; color: #5c3b00; margin-bottom: 2px;">
                <label style="display: flex; align-items: center; gap: 4px; cursor: pointer;">
                    <input type="radio" name="yt-filter-mode" value="title">
                    <span>Title</span>
                </label>
                <label style="display: flex; align-items: center; gap: 4px; cursor: pointer;">
                    <input type="radio" name="yt-filter-mode" value="channel">
                    <span>Channel</span>
                </label>
            </div>
            <input id="yt-filter-query-input-1" type="text" placeholder="Row 1: keywords (space = AND)" style="width: 100%; padding: 4px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
            <input id="yt-filter-query-input-2" type="text" placeholder="Row 2: keywords (space = AND)" style="width: 100%; padding: 4px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
            <input id="yt-filter-query-input-3" type="text" placeholder="Row 3: keywords (space = AND)" style="width: 100%; padding: 4px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
            <input id="yt-filter-query-input-4" type="text" placeholder="Row 4: keywords (space = AND)" style="width: 100%; padding: 4px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
            <input id="yt-filter-query-input-5" type="text" placeholder="Row 5: keywords (space = AND)" style="width: 100%; padding: 4px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
        </div>
        <div id="yt-filter-count" style="font-size: 12px;">Results: - / -</div>
        <div id="yt-filter-queue-info" style="font-size: 11px; color: #666;">Queue: 0 items</div>
        <button id="yt-filter-reset-btn" type="button" style="width: 100%; padding: 4px 6px; font-size: 11px; cursor: pointer; background-color: #fff; color: #5c3b00; border: 1px solid #d69e5b; border-radius: 4px; margin-top: 2px;">Reset Filter</button>
        <div style="font-size: 10px; color: #666; margin-top: 2px;">Each row: space-separated keywords are AND. Multiple rows are OR. Press Enter to apply. Click locked input to edit.</div>
        <div style="font-size: 10px; color: #666; display: flex; flex-direction: column; gap: 1px;">
            <div id="yt-filter-status-monitor">Monitor: Idle</div>
            <div id="yt-filter-status-scanner">Scanner: Idle</div>
            <div id="yt-filter-status-processor">Processor: Idle</div>
        </div>
    </div>
</div>
