<div id="yt-lite-panel" class="yus-panel" style="background-color: #f0f8ff; border-color: #00f; --yus-hover-color: #00f;">
    <div id="yt-lite-header" class="yus-header">
        <span id="yt-lite-title" class="yus-title" title="Double-click to toggle minimization">Lite v{{VERSION}}</span>
    </div>
    <div id="yt-lite-panel-content" class="yus-content">
        <div style="display: flex; align-items: center; gap: 4px; font-size: 10px;">
            <input type="checkbox" id="yt-lite-hide-thumb">
            <label for="yt-lite-hide-thumb" style="cursor: pointer;">Hide Thumbs (CSS)</label>
        </div>
        <div style="display: flex; align-items: center; gap: 4px; font-size: 10px;">
            <input type="checkbox" id="yt-lite-force-remove">
            <label for="yt-lite-force-remove" style="cursor: pointer;">Remove Thumbs (DOM)</label>
        </div>
        <hr style="margin: 2px 0; border: 0; border-top: 1px solid #ccc; width: 100%;">
        <div style="display: flex; align-items: center; gap: 4px; font-size: 10px;">
            <input type="checkbox" id="yt-lite-hide-miniplayer">
            <label for="yt-lite-hide-miniplayer" style="cursor: pointer;">Hide Miniplayer (CSS)</label>
        </div>
        <div style="display: flex; align-items: center; gap: 4px; font-size: 10px;">
            <input type="checkbox" id="yt-lite-remove-miniplayer">
            <label for="yt-lite-remove-miniplayer" style="cursor: pointer;">Remove Miniplayer (DOM)</label>
        </div>
        <button id="yt-lite-clear-btn" type="button" style="padding: 4px; font-size: 10px; background-color: #eef; border: 1px solid #99f; border-radius: 4px; cursor: pointer;">Clear Now</button>
    </div>
</div>
