<div id="yt-saver-panel" class="yus-panel" style="background-color: #f1f8e9; width: 220px; --yus-hover-color: #2ba640;">
    <div id="yt-saver-header" class="yus-header" style="margin-bottom: 6px;">
        <span id="yt-saver-title" class="yus-title" title="Double-click to toggle minimization">Playlist Saver v{{VERSION}}</span>
    </div>
    <div id="yt-saver-panel-content" class="yus-content" style="gap: 6px;">
        <div style="display: flex; justify-content: space-between; align-items: center; font-size: 12px;">
            <span style="color: #555;">Saved IDs (Total)</span>
            <span id="yt-saver-stats-total" style="font-weight: bold;">-</span>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center; font-size: 12px;">
            <span style="color: #555;">SAVED in List</span>
            <span id="yt-saver-stats-saved" style="font-weight: bold;">-</span>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center; font-size: 12px;">
            <span style="color: #555;">NEW in List</span>
            <span id="yt-saver-stats-new" style="font-weight: bold;">-</span>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center; font-size: 12px;">
            <span style="color: #555;">Storage</span>
            <span id="yt-saver-stats-storage" style="font-weight: bold;">-</span>
        </div>
        <div style="display: flex; gap: 6px; margin-top: 4px;">
            <button id="yt-saver-export-btn" type="button" style="flex: 1 1 0%; padding: 4px 6px; font-size: 11px; border: 1px solid #a6c8a6; border-radius: 4px; background-color: #f5fff5; cursor: pointer;">Export JSON</button>
            <button id="yt-saver-copy-btn" type="button" style="flex: 1 1 0%; padding: 4px 6px; font-size: 11px; border: 1px solid #a6c8a6; border-radius: 4px; background-color: #f5fff5; cursor: pointer;">Copy JSON</button>
        </div>
    </div>
</div>
