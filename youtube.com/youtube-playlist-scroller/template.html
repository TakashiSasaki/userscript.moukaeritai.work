<div id="yt-scroller-panel" class="yus-panel" style="--yus-panel-bg-rgb: 255, 253, 231; border-color: #ccc; --yus-hover-color: #00f;">
    <div id="yt-scroller-header" class="yus-header" style="cursor: move;">
        <span id="yt-scroller-title" class="yus-title" title="Double-click to toggle minimization">Auto Scroller v{{VERSION}}</span>
    </div>
    <div id="yt-scroller-panel-content" class="yus-content">
        <div style="font-size: 12px; display: flex; justify-content: space-between; gap: 8px;">
            <span>Status: <span id="yt-scroller-loading-status" style="color: #888; margin-left: 4px;">Idle</span></span>
            <span>Remaining: <span id="yt-scroller-remaining-time" style="color: #888; margin-left: 4px;">Stopped</span></span>
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px;">
            <button id="yt-scroller-run-10s-btn" data-duration-seconds="10" style="padding: 3px 8px; font-size: 11px; background-color: #fff; color: #333; border: 1px solid #ccc; border-radius: 4px; cursor: pointer; font-weight: bold;">10s</button>
            <button id="yt-scroller-run-1m-btn" data-duration-seconds="60" style="padding: 3px 8px; font-size: 11px; background-color: #fff; color: #333; border: 1px solid #ccc; border-radius: 4px; cursor: pointer; font-weight: bold;">1m</button>
            <button id="yt-scroller-run-5m-btn" data-duration-seconds="300" style="padding: 3px 8px; font-size: 11px; background-color: #fff; color: #333; border: 1px solid #ccc; border-radius: 4px; cursor: pointer; font-weight: bold;">5m</button>
        </div>
    </div>
</div>
